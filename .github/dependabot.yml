# Weekly automatic checks for known vulnerabilities and outdated packages.
# GitHub opens a pull request for each update; nothing goes live until it's reviewed and merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
